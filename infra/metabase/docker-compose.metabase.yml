services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${NORTHSTAR_POSTGRES_ADMIN_USER:-northstar}
      POSTGRES_PASSWORD: ${NORTHSTAR_POSTGRES_ADMIN_PASSWORD:?set NORTHSTAR_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: northstar
    ports:
      - "${NORTHSTAR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - northstar_pg_data:/var/lib/postgresql/data
      - ./init/create_metabase_app.sql:/docker-entrypoint-initdb.d/01-create-metabase-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d northstar"]
      interval: 2s
      timeout: 3s
      retries: 30

  metabase:
    image: eclipse-temurin:21-jre@sha256:371da296b8cb74c7e53fbe7083d5374befc0011b493231d97d45fa789915e434
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: ${NORTHSTAR_POSTGRES_ADMIN_USER:-northstar}
      MB_DB_PASS: ${NORTHSTAR_POSTGRES_ADMIN_PASSWORD:?set NORTHSTAR_POSTGRES_ADMIN_PASSWORD}
      JAVA_TIMEZONE: UTC
    volumes:
      - ../../metabase/.runtime/metabase.jar:/app/metabase.jar:ro
    entrypoint:
      - java
      - -XX:+IgnoreUnrecognizedVMOptions
      - -Dfile.encoding=UTF-8
      - --add-opens
      - java.base/java.nio=ALL-UNNAMED
      - -jar
      - /app/metabase.jar
    ports:
      - "${METABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/metabase.jar", "health-check"]
      interval: 5s
      timeout: 10s
      retries: 60

x-metabase-release:
  semantic-version: 0.63.2.7
  official-image: metabase/metabase:v0.63.2.x
  official-image-digest: sha256:095503d38b0048c1e7b499509d04ffb7b9999167872199a34bb7b73c5913fb9d
  official-jar-sha256: dc719b2dce60e0fae8d351dc0d44a59f0da696245f10bfb2882aa20c0506c858

volumes:
  northstar_pg_data:
